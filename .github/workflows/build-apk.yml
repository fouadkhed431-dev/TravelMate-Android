name: Build TravelMate Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npx cap add android
      - run: npm run prepare:v14
      - run: npm run prepare:v15
      - run: npm run prepare:v16
      - name: Prepare V17 assets and OCR base
        run: |
          sed -i 's/^  rebuildLauncher();/  await rebuildLauncher();/' scripts/prepare-v17.js
          npm run prepare:v17
      - run: npm run prepare:v19
      - name: Verify final launcher and OCR patch
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-mdpi/ic_launcher_foreground.png
          grep -q 'v19-ocr-raw' www/v71-upgrade.js
          grep -q 'travelmate-v19-shell' www/sw.js
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-V19-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
