name: Build TravelMate V22 OCR Repair APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npx cap add android
      - run: npm run prepare:v14
      - run: npm run prepare:v15
      - run: npm run prepare:v16
      - name: Prepare V17 assets
        run: |
          sed -i 's/^  rebuildLauncher();/  await rebuildLauncher();/' scripts/prepare-v17.js
          npm run prepare:v17
      - run: npm run prepare:v21
      - name: Prepare V22 multilingual OCR
        run: npm run prepare:v22
      - name: Verify generated OCR and app assets
        run: |
          node --check www/v21-receipts.js
          grep -q "eng+tur" www/v21-receipts.js
          grep -q "eng+ara" www/v21-receipts.js
          grep -q "createImageBitmap" www/v21-receipts.js
          grep -qi "total" www/v21-receipts.js
          grep -q 'src="v21-receipts.js"' www/index.html
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-mdpi/ic_launcher_foreground.png
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-V22-OCR-Repair-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
