name: Build TravelMate V24 Launcher Icon Fix
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npx cap add android
      - run: npm run prepare:v14
      - run: npm run prepare:v15
      - run: npm run prepare:v16
      - name: Prepare V17 assets
        run: |
          sed -i 's/^  rebuildLauncher();/  await rebuildLauncher();/' scripts/prepare-v17.js
          npm run prepare:v17
      - run: npm run prepare:v21
      - name: Prepare V22 multilingual OCR base
        run: npm run prepare:v22
      - name: Apply V23 OCR merge and validation fix
        run: node scripts/prepare-v23.js
      - name: Verify generated OCR module
        shell: bash
        run: |
          set -euo pipefail
          node --check www/v21-receipts.js
          grep -Fq 'eng+tur' www/v21-receipts.js
          grep -Fq 'eng+ara' www/v21-receipts.js
          grep -Fq "raw:parts.join" www/v21-receipts.js
          grep -Fq 'const merged=' www/v21-receipts.js
          grep -Fq 'Amounts do not add up' www/v21-receipts.js
          grep -Fq 'src="v21-receipts.js"' www/index.html
          echo '✓ Existing app checks passed'
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Rebuild launcher icons after Capacitor sync
        run: node scripts/finalize-launcher.js
      - name: Verify final launcher resources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_monochrome.png
          echo '✓ Final Android launcher resources verified'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-V24-Launcher-Icon-Fix-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
