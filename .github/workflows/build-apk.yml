name: Build TravelMate V23 OCR Merge Fix APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npx cap add android
      - run: npm run prepare:v14
      - run: npm run prepare:v15
      - run: npm run prepare:v16
      - name: Prepare V17 assets
        run: |
          sed -i 's/^  rebuildLauncher();/  await rebuildLauncher();/' scripts/prepare-v17.js
          npm run prepare:v17
      - run: npm run prepare:v21
      - name: Prepare V22 multilingual OCR base
        run: npm run prepare:v22
      - name: Apply V23 OCR merge and validation fix
        run: node scripts/prepare-v23.js
      - name: Verify generated OCR module
        shell: bash
        run: |
          set -euo pipefail
          node --check www/v21-receipts.js
          echo '✓ JavaScript syntax valid'
          grep -Fq 'eng+tur' www/v21-receipts.js
          echo '✓ Turkish/English OCR worker present'
          grep -Fq 'eng+ara' www/v21-receipts.js
          echo '✓ Arabic/English OCR worker present'
          grep -Fq "raw:parts.join" www/v21-receipts.js
          grep -Fq 'const merged=' www/v21-receipts.js
          echo '✓ Multi-attempt OCR merge implementation present'
          grep -Fq 'Amounts do not add up' www/v21-receipts.js
          echo '✓ Arithmetic validation present'
          grep -Fq 'src="v21-receipts.js"' www/index.html
          echo '✓ Receipt module included in app page'
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png || { echo 'Launcher mipmap missing'; exit 1; }
          echo '✓ Launcher mipmap present'
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png || { echo 'Launcher foreground missing'; exit 1; }
          echo '✓ Launcher foreground present'
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TravelMate-V23-OCR-Merge-Fix-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
